name: Sync and Build Tailscale

on:
  schedule:
    - cron: '10 23 * * *'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Tailscale versions (e.g. 1.102.4 or 1.100.0-1.102.4; empty for latest stable)'
        required: false
        type: string
      platforms:
        description: 'Space-separated Go architectures; MT7621 uses mipsle'
        required: false
        default: 'amd64 386 arm arm64 mips mipsle mips64 mips64le'
        type: string
  watch:
    types: [started]

permissions:
  contents: write

concurrency:
  group: tailscale-release
  cancel-in-progress: false

env:
  REPO_OFFICIAL: tailscale/tailscale
  BUILD_PLATFORMS: ${{ inputs.platforms || 'amd64 386 arm arm64 mips mipsle mips64 mips64le' }}
  GO_BUILD_TAGS: ts_include_cli,ts_omit_aws,ts_omit_bird,ts_omit_completion,ts_omit_kube,ts_omit_systray,ts_omit_taildrop,ts_omit_tap,ts_omit_tpm,ts_omit_capture,ts_omit_syspolicy,ts_omit_debugeventbus,ts_omit_webclient,ts_omit_clientupdate,ts_omit_linuxdnsfight

jobs:
  prepare_versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Select unreleased stable versions
        id: versions
        env:
          VERSION_INPUT: ${{ inputs.versions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, urllib.request

          def releases(repo):
              result = []
              for page in range(1, 11):
                  request = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}',
                      headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                               'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request) as response:
                      batch = json.load(response)
                  result.extend(batch)
                  if len(batch) < 100:
                      break
              return result

          def version(tag):
              return tuple(map(int, tag.removeprefix('v').split('.')))

          official = [r['tag_name'].removeprefix('v') for r in releases(os.environ['REPO_OFFICIAL'])
                      if not r['draft'] and not r['prerelease']
                      and re.fullmatch(r'v?\d+\.\d+\.\d+', r['tag_name'])]
          if not official:
              raise SystemExit('No official stable releases found')
          existing = {r['tag_name'].removeprefix('v') for r in releases(os.environ['GITHUB_REPOSITORY'])}
          requested = os.environ.get('VERSION_INPUT', '').strip()
          selected = set()
          if not requested:
              selected.add(max(official, key=version))
          else:
              for part in requested.split(','):
                  part = part.strip()
                  if not re.fullmatch(r'v?\d+\.\d+\.\d+(?:-v?\d+\.\d+\.\d+)?', part):
                      raise SystemExit(f'Invalid version input: {part}')
                  if '-' in part:
                      start, end = map(version, part.split('-'))
                      if start > end:
                          raise SystemExit(f'Invalid version range: {part}')
                      selected.update(v for v in official if start <= version(v) <= end)
                  else:
                      selected.add(part.removeprefix('v'))
          unknown = selected.difference(official)
          if unknown:
              raise SystemExit(f'Not official stable releases: {sorted(unknown)}')
          matrix = sorted(selected.difference(existing), key=version) or ['skip']
          print(f'Selected versions: {matrix}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'matrix={json.dumps(matrix)}\n')
          PYTHON

  build_and_release:
    needs: prepare_versions
    if: needs.prepare_versions.outputs.matrix != '["skip"]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        version: ${{ fromJson(needs.prepare_versions.outputs.matrix) }}
      max-parallel: 1
    env:
      TAG: v${{ matrix.version }}
    steps:
      - name: Checkout official Tailscale source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_OFFICIAL }}
          ref: ${{ env.TAG }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Build Smaller Tailscale as ordinary ELF binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p build
          printf '%s\n' "$TAG" > build/version.txt
          source_commit=$(git rev-parse HEAD)
          for arch in $BUILD_PLATFORMS; do
            case "$arch" in
              amd64|386|arm|arm64|mips|mipsle|mips64|mips64le) ;;
              *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
            esac
            export GOARCH="$arch"
            unset GOMIPS GOMIPS64
            case "$arch" in
              mips|mipsle) export GOMIPS=softfloat ;;
              mips64|mips64le) export GOMIPS64=softfloat ;;
            esac
            binary="build/tailscaled-linux-${arch}"
            go list -deps -tags "$GO_BUILD_TAGS" ./cmd/tailscaled > "build/dependencies-${arch}.txt"
            if grep -qx 'tailscale.com/feature/linuxdnsfight' "build/dependencies-${arch}.txt"; then
              echo 'Recursive /etc DNS monitoring must be omitted' >&2
              exit 1
            fi
            grep -qx 'tailscale.com/net/dns' "build/dependencies-${arch}.txt"
            grep -qx 'tailscale.com/feature/ssh' "build/dependencies-${arch}.txt"
            go build -trimpath -buildvcs=false -tags "$GO_BUILD_TAGS" \
              -ldflags "-s -w -X tailscale.com/version.longStamp=${TAG#v}-wulu-r10 -X tailscale.com/version.shortStamp=${TAG#v}" \
              -o "$binary" ./cmd/tailscaled
            go version -m "$binary"
            file "$binary"
            jq -n --arg version "${TAG#v}" --arg source "$source_commit" \
              --arg workflow "$GITHUB_SHA" --arg go "$(go env GOVERSION)" \
              --arg arch "$arch" --arg tags "$GO_BUILD_TAGS" \
              --arg gomips "${GOMIPS:-${GOMIPS64:-}}" --arg sha "$(sha256sum "$binary" | cut -d' ' -f1)" \
              '{version: $version, source_commit: $source, workflow_commit: $workflow,
                go: $go, goos: "linux", goarch: $arch, gomips: $gomips, cgo: false,
                tags: ($tags | split(",")), upx: false, sha256: $sha}' \
              > "build/build-info-${arch}.json"
          done
          (cd build && sha256sum tailscaled-linux-* build-info-*.json version.txt > SHA256SUMS.txt)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 'Smaller Tailscale ${{ env.TAG }}'
          target_commitish: ${{ github.sha }}
          body: |
            Smaller Tailscale built from the official source with Go 1.27.1.

            - Ordinary stripped ELF binaries, without UPX. OpenWrt firmware can compress them with SquashFS.
            - Combined CLI and daemon; create a `tailscale` symlink to the binary for CLI use.
            - Retains Tailscale SSH, DNS configuration, subnet routing, exit nodes, and Peer Relay.
            - Omits AWS, BIRD, completion, Kubernetes, systray, Taildrop, TAP, TPM, capture, syspolicy, debug event bus, web client, and client update.
            - Omits recursive Linux DNS conflict monitoring (`ts_omit_linuxdnsfight`) to avoid processing every `/etc` access on OpenWrt. DNS configuration is retained; automatic repair of external resolv.conf changes is unavailable.
            - MT7621 uses `tailscaled-linux-mipsle`: 32-bit little-endian MIPS, software floating point, CGO disabled.

            Build metadata and SHA256SUMS accompany the binaries. Verify with `sha256sum -c SHA256SUMS.txt`.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/tailscaled-linux-*
            build/build-info-*.json
            build/version.txt
            build/SHA256SUMS.txt
